<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Happy Birthday, Semsemty!</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f0ff;--card:#fff;--ink:#2b1747;--soft:#6e5a8e;--pink:#ff4f8b;--sun:#ffd66b;--line:#e6d9fb;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0f2e;--card:#2a1948;--ink:#fff0f7;--soft:#c3b1e6;--line:#3d2a66}}
:root[data-theme="dark"]{--bg:#1a0f2e;--card:#2a1948;--ink:#fff0f7;--soft:#c3b1e6;--line:#3d2a66}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Fredoka',system-ui,sans-serif;text-align:center;overflow-x:hidden}
main{max-width:440px;margin:0 auto;padding:0 20px 60px}
section{min-height:78vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:28px 0}
section[hidden]{display:none}
h1{font-size:2.2rem;line-height:1.15;margin:0}
p{margin:0;color:var(--soft);font-size:1.05rem}
button{font:inherit;font-weight:600;border:0;border-radius:999px;padding:14px 26px;background:var(--pink);color:#fff;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.18);text-decoration:none;display:inline-block}
button:active,.btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.18)}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
#gift{background:none;box-shadow:none;font-size:7rem;padding:0;line-height:1;animation:wob 1.6s ease-in-out infinite}
#gift.open{animation:pop .5s forwards}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.06)}}
@keyframes pop{to{transform:scale(1.7);opacity:0}}
.letter{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px 22px;width:100%;text-align:left;font-family:'Caveat',cursive;font-weight:500;font-size:1.65rem;line-height:1.35;white-space:pre-wrap;min-height:20rem;transform:rotate(-1deg)}
#candle{background:none;box-shadow:none;padding:0;width:90px}
.flame{transform-origin:50% 100%;animation:fl .5s ease-in-out infinite alternate}
@keyframes fl{to{transform:scale(1.12,.92) rotate(3deg)}}
#candle.out .flame{display:none}
#wish{min-height:3.2rem;color:var(--pink);font-weight:600}
.coupon{background:var(--sun);color:#3a2300;border-radius:18px;padding:22px 20px;width:100%;border:3px dashed #3a2300;font-weight:600;font-size:1.15rem;transform:rotate(1.5deg)}
.coupon span{display:block;font-size:2.2rem}
.song{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:26px 20px;width:100%;display:flex;flex-direction:column;align-items:center;gap:16px}
#qr{background:#fff;padding:10px;border-radius:12px;min-height:150px;min-width:150px}
.sig{font-family:'Caveat',cursive;font-size:2rem;color:var(--ink)}
#fx{position:fixed;inset:0;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){#gift,.flame{animation:none}}
</style>
</head>
<body>
<canvas id="fx"></canvas>
<main>
<section id="s1">
  <h1>Happy Birthday, Semsemty! 🎂</h1>
  <p>Got a little something for you...</p>
  <button id="gift" aria-label="Open the gift">🎁</button>
  <p>Tap the gift</p>
</section>

<section id="s2" hidden>
  <div class="letter" id="letter" aria-live="polite"></div>
</section>

<section id="s3" hidden>
  <p>Make a wish, Semsemty 🕯️</p>
  <button id="candle" aria-label="Blow out the candle">
    <svg viewBox="0 0 60 120" width="90" aria-hidden="true">
      <g class="flame"><path d="M30 6C42 24 46 34 30 50 14 34 18 24 30 6Z" fill="#ffb02e"/><path d="M30 24C36 32 37 38 30 46 23 38 24 32 30 24Z" fill="#fff2a8"/></g>
      <rect x="24" y="50" width="12" height="62" rx="3" fill="#ff4f8b"/>
      <path d="M24 66h12M24 82h12M24 98h12" stroke="#fff" stroke-width="3" opacity=".6"/>
    </svg>
  </button>
  <p>Tap the candle</p>
  <div id="wish"></div>
</section>

<section id="s4" hidden>
  <button id="more">Wait, there's more...</button>
</section>

<section id="s5" hidden>
  <div class="song">
    <h1>To My Favorite ❤</h1>
    <p>Some songs just sound like us.</p>
    <a class="btn" href="https://vt.tiktok.com/ZSpK4dfod/" target="_blank" rel="noopener"><button type="button">Play it ❤</button></a>
    <div id="qr"></div>
  </div>
  <div class="sig">Love you always,<br>Toty 💛</div>
</section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
const $=id=>document.getElementById(id);
function show(el){el.hidden=false;setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'center'}),60)}

// confetti
const cv=$('fx'),cx=cv.getContext('2d');let parts=[],raf=0;
function size(){cv.width=innerWidth;cv.height=innerHeight}size();addEventListener('resize',size);
function burst(){
  const cols=['#ff4f8b','#ffd66b','#7c5cff','#4fd1c5','#ff9a5c'];
  for(let i=0;i<160;i++)parts.push({x:innerWidth/2,y:innerHeight/2,vx:(Math.random()-.5)*14,vy:Math.random()*-14-2,s:4+Math.random()*6,c:cols[i%5],r:Math.random()*6,l:140+Math.random()*60});
  cancelAnimationFrame(raf);(function tick(){
    cx.clearRect(0,0,cv.width,cv.height);
    parts=parts.filter(p=>p.l-->0);
    parts.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=.2;cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore()});
    if(parts.length)raf=requestAnimationFrame(tick);else cx.clearRect(0,0,cv.width,cv.height);
  })();
}

const msg=`Hey Semsemty,
Happy birthday! 🥳
I love you, seriously.
You’ve been the sweet part of my days. So many times you made things easier for me, and you probably didn’t even know it.
And whatever happens, you’re my sister, not just my friend. Always.
Thank you for being in my life. 💛`;

$('gift').onclick=function(){
  this.classList.add('open');burst();
  setTimeout(()=>{show($('s2'));let i=0;const L=$('letter');
    (function t(){L.textContent=msg.slice(0,++i);
      if(i<msg.length)setTimeout(t,/[.!,\n]/.test(msg[i-1])?160:38);
      else setTimeout(()=>show($('s3')),900)})();
  },700);
};

$('candle').onclick=function(){
  if(this.classList.contains('out'))return;
  this.classList.add('out');
  $('wish').textContent='Hope this year is as sweet to you as you are to me.';
  burst();setTimeout(()=>show($('s4')),1400);
};

$('more').onclick=function(){
  this.parentElement.hidden=true;burst();
  show($('s5'));
  try{new QRCode($('qr'),{text:'https://vt.tiktok.com/ZSpK4dfod/',width:150,height:150,colorDark:'#2b1747',colorLight:'#ffffff'})}catch(e){$('qr').style.display='none'}
};
</script>
</body>
</html>
